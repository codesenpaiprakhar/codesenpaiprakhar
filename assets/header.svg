<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient (Warm Ambient Glow) -->
    <radialGradient id="glow" cx="50%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#3D2E0B" stop-opacity="0.75" />
      <stop offset="45%" stop-color="#1E1708" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0B0C0E" stop-opacity="1" />
    </radialGradient>

    <!-- Subtle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B3A14" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1F1B12" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#141416" stop-opacity="0.8" />
    </linearGradient>

    <!-- Gold Accent Divider Gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="1" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </linearGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .badge-pill {
      fill: #14130E;
      stroke: #E5A93C;
      stroke-width: 1.2;
    }
    .badge-text {
      fill: #E5A93C;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.2px;
    }
    .hero-title {
      fill: #FFFFFF;
      font-size: 46px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }
    .hero-subtitle {
      fill: #C2C6CE;
      font-size: 17px;
      font-weight: 400;
      letter-spacing: 0.2px;
    }
  </style>

  <!-- Card Background Container -->
  <rect x="2" y="2" width="896" height="316" rx="16" fill="url(#glow)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Top Pill Badge: SOFTWARE ENGINEER -->
  <g transform="translate(355, 55)">
    <rect class="badge-pill" x="0" y="0" width="190" height="30" rx="15" />
    <circle cx="16" cy="15" r="3.5" fill="#E5A93C" />
    <text class="font-sans badge-text" x="100" y="19" text-anchor="middle">SOFTWARE ENGINEER</text>
  </g>

  <!-- Big Hero Name: Prakhar Singh -->
  <text class="font-sans hero-title" x="450" y="160" text-anchor="middle">Prakhar Singh</text>

  <!-- Subtitle -->
  <text class="font-sans hero-subtitle" x="450" y="206" text-anchor="middle">Architecting reliable systems, clean APIs, and scalable backend infrastructure.</text>

  <!-- Centered Gold Accent Line -->
  <rect x="415" y="246" width="70" height="3" rx="1.5" fill="url(#goldAccent)" />

</svg>
