<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="100%">
  <defs>
    <!-- Dark card ambient gradient -->
    <radialGradient id="cardAmbient" cx="15%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#2D220A" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#101114" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0E1013" stop-opacity="1" />
    </radialGradient>

    <!-- Border gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#362E1C" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#1E1C16" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#292213" stop-opacity="0.8" />
    </linearGradient>

    <!-- Icon Box Glow -->
    <linearGradient id="iconBoxBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .label {
      fill: #F59E0B;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .heading {
      fill: #FFFFFF;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .pillar-title {
      fill: #FFFFFF;
      font-size: 15px;
      font-weight: 600;
    }
    .pillar-desc {
      fill: #94A3B8;
      font-size: 12.5px;
      font-weight: 400;
      line-height: 1.4;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="896" height="226" rx="16" fill="url(#cardAmbient)" stroke="url(#cardBorder)" stroke-width="1.5" />

  <!-- Section Header -->
  <text class="font-sans label" x="40" y="44">ENGINEERING PHILOSOPHY</text>
  <text class="font-sans heading" x="40" y="78">Designing for reliability and scale.</text>

  <!-- ================= PILLAR 1: System Design First ================= -->
  <g transform="translate(40, 115)">
    <!-- Icon Box -->
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#17150E" stroke="url(#iconBoxBorder)" stroke-width="1.5" />
    <!-- Database / Server Stack Icon -->
    <path d="M14 17c0-2 4-3.5 8-3.5s8 1.5 8 3.5-4 3.5-8 3.5-8-1.5-8-3.5z" fill="none" stroke="#F59E0B" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M14 22c0 2 4 3.5 8 3.5s8-1.5 8-3.5" fill="none" stroke="#F59E0B" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M14 27c0 2 4 3.5 8 3.5s8-1.5 8-3.5" fill="none" stroke="#F59E0B" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="14" y1="17" x2="14" y2="27" stroke="#F59E0B" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="30" y1="17" x2="30" y2="27" stroke="#F59E0B" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Texts -->
    <text class="font-sans pillar-title" x="58" y="20">System Design First</text>
    <text class="font-sans pillar-desc" x="58" y="38">Architecture mapped to</text>
    <text class="font-sans pillar-desc" x="58" y="54">real domain constraints.</text>
  </g>

  <!-- ================= PILLAR 2: Backend Correctness ================= -->
  <g transform="translate(330, 115)">
    <!-- Icon Box -->
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#17150E" stroke="url(#iconBoxBorder)" stroke-width="1.5" />
    <!-- Shield / Security & Correctness Icon -->
    <path d="M22 13l9 4v6c0 6-4 10-9 12-5-2-9-6-9-12v-6l9-4z" fill="none" stroke="#F59E0B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 23l3 3 5-5" fill="none" stroke="#F59E0B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Texts -->
    <text class="font-sans pillar-title" x="58" y="20">Backend Correctness</text>
    <text class="font-sans pillar-desc" x="58" y="38">Controlled state transitions</text>
    <text class="font-sans pillar-desc" x="58" y="54">over loose flag updates.</text>
  </g>

  <!-- ================= PILLAR 3: Explicit API Boundaries ================= -->
  <g transform="translate(620, 115)">
    <!-- Icon Box -->
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#17150E" stroke="url(#iconBoxBorder)" stroke-width="1.5" />
    <!-- Network / Nodes / API Contract Icon -->
    <circle cx="17" cy="22" r="3.2" fill="none" stroke="#F59E0B" stroke-width="1.6"/>
    <circle cx="27" cy="16" r="3.2" fill="none" stroke="#F59E0B" stroke-width="1.6"/>
    <circle cx="27" cy="28" r="3.2" fill="none" stroke="#F59E0B" stroke-width="1.6"/>
    <path d="M20 21l4-3M20 23l4 3" fill="none" stroke="#F59E0B" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Texts -->
    <text class="font-sans pillar-title" x="58" y="20">Explicit API Boundaries</text>
    <text class="font-sans pillar-desc" x="58" y="38">Clear contracts to reduce</text>
    <text class="font-sans pillar-desc" x="58" y="54">frontend ambiguity.</text>
  </g>

</svg>
