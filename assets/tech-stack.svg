<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="100%" height="100%">
  <defs>
    <!-- Dark card ambient gradient -->
    <radialGradient id="techAmbient" cx="85%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#2D220A" stop-opacity="0.38" />
      <stop offset="55%" stop-color="#101114" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0E1013" stop-opacity="1" />
    </radialGradient>

    <!-- Subtle border gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#362E1C" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#1E1C16" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#292213" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .label {
      fill: #F59E0B;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .heading {
      fill: #FFFFFF;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .cat-title {
      fill: #E5A93C;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.2px;
    }
    .tag-bg {
      fill: #161511;
      stroke: #2E2716;
      stroke-width: 1;
    }
    .tag-text {
      fill: #E2E8F0;
      font-size: 12px;
      font-weight: 500;
    }
  </style>

  <!-- Card Container Box -->
  <rect x="2" y="2" width="896" height="386" rx="16" fill="url(#techAmbient)" stroke="url(#cardBorder)" stroke-width="1.5" />

  <!-- Section Header -->
  <text class="font-sans label" x="40" y="44">TECHNICAL CAPABILITIES</text>
  <text class="font-sans heading" x="40" y="78">Technologies, frameworks, and engineering tools.</text>

  <!-- ================= ROW 1 ================= -->
  <!-- Col 1: LANGUAGES -->
  <g transform="translate(40, 112)">
    <text class="font-sans cat-title" x="0" y="0">LANGUAGES</text>
    
    <!-- Java -->
    <rect class="tag-bg" x="0" y="10" width="56" height="26" rx="5" />
    <text class="font-sans tag-text" x="28" y="27" text-anchor="middle">Java</text>

    <!-- Python -->
    <rect class="tag-bg" x="64" y="10" width="68" height="26" rx="5" />
    <text class="font-sans tag-text" x="98" y="27" text-anchor="middle">Python</text>

    <!-- JavaScript -->
    <rect class="tag-bg" x="140" y="10" width="88" height="26" rx="5" />
    <text class="font-sans tag-text" x="184" y="27" text-anchor="middle">JavaScript</text>

    <!-- SQL -->
    <rect class="tag-bg" x="236" y="10" width="52" height="26" rx="5" />
    <text class="font-sans tag-text" x="262" y="27" text-anchor="middle">SQL</text>
  </g>

  <!-- Col 2: FRONTEND -->
  <g transform="translate(470, 112)">
    <text class="font-sans cat-title" x="0" y="0">FRONTEND</text>

    <!-- React -->
    <rect class="tag-bg" x="0" y="10" width="60" height="26" rx="5" />
    <text class="font-sans tag-text" x="30" y="27" text-anchor="middle">React</text>

    <!-- Vite -->
    <rect class="tag-bg" x="68" y="10" width="52" height="26" rx="5" />
    <text class="font-sans tag-text" x="94" y="27" text-anchor="middle">Vite</text>

    <!-- HTML -->
    <rect class="tag-bg" x="128" y="10" width="54" height="26" rx="5" />
    <text class="font-sans tag-text" x="155" y="27" text-anchor="middle">HTML</text>

    <!-- CSS -->
    <rect class="tag-bg" x="190" y="10" width="52" height="26" rx="5" />
    <text class="font-sans tag-text" x="216" y="27" text-anchor="middle">CSS</text>
  </g>

  <!-- ================= ROW 2 ================= -->
  <!-- Col 1: BACKEND -->
  <g transform="translate(40, 180)">
    <text class="font-sans cat-title" x="0" y="0">BACKEND</text>

    <!-- Spring Boot -->
    <rect class="tag-bg" x="0" y="10" width="96" height="26" rx="5" />
    <text class="font-sans tag-text" x="48" y="27" text-anchor="middle">Spring Boot</text>

    <!-- Flask -->
    <rect class="tag-bg" x="104" y="10" width="56" height="26" rx="5" />
    <text class="font-sans tag-text" x="132" y="27" text-anchor="middle">Flask</text>

    <!-- REST APIs -->
    <rect class="tag-bg" x="168" y="10" width="84" height="26" rx="5" />
    <text class="font-sans tag-text" x="210" y="27" text-anchor="middle">REST APIs</text>
  </g>

  <!-- Col 2: DATABASES &amp; TOOLS -->
  <g transform="translate(470, 180)">
    <text class="font-sans cat-title" x="0" y="0">DATABASES &amp; TOOLS</text>

    <!-- MySQL -->
    <rect class="tag-bg" x="0" y="10" width="66" height="26" rx="5" />
    <text class="font-sans tag-text" x="33" y="27" text-anchor="middle">MySQL</text>

    <!-- SQLite -->
    <rect class="tag-bg" x="74" y="10" width="64" height="26" rx="5" />
    <text class="font-sans tag-text" x="106" y="27" text-anchor="middle">SQLite</text>

    <!-- DBeaver -->
    <rect class="tag-bg" x="146" y="10" width="76" height="26" rx="5" />
    <text class="font-sans tag-text" x="184" y="27" text-anchor="middle">DBeaver</text>
  </g>

  <!-- ================= ROW 3 ================= -->
  <!-- Col 1: DEVOPS &amp; VERSION CONTROL -->
  <g transform="translate(40, 248)">
    <text class="font-sans cat-title" x="0" y="0">DEVOPS &amp; VERSION CONTROL</text>

    <!-- Docker -->
    <rect class="tag-bg" x="0" y="10" width="68" height="26" rx="5" />
    <text class="font-sans tag-text" x="34" y="27" text-anchor="middle">Docker</text>

    <!-- Git -->
    <rect class="tag-bg" x="76" y="10" width="48" height="26" rx="5" />
    <text class="font-sans tag-text" x="100" y="27" text-anchor="middle">Git</text>

    <!-- GitHub -->
    <rect class="tag-bg" x="132" y="10" width="68" height="26" rx="5" />
    <text class="font-sans tag-text" x="166" y="27" text-anchor="middle">GitHub</text>
  </g>

  <!-- Col 2: MACHINE LEARNING -->
  <g transform="translate(470, 248)">
    <text class="font-sans cat-title" x="0" y="0">MACHINE LEARNING</text>

    <!-- Pandas -->
    <rect class="tag-bg" x="0" y="10" width="68" height="26" rx="5" />
    <text class="font-sans tag-text" x="34" y="27" text-anchor="middle">Pandas</text>

    <!-- NumPy -->
    <rect class="tag-bg" x="76" y="10" width="68" height="26" rx="5" />
    <text class="font-sans tag-text" x="110" y="27" text-anchor="middle">NumPy</text>

    <!-- Scikit-learn -->
    <rect class="tag-bg" x="152" y="10" width="96" height="26" rx="5" />
    <text class="font-sans tag-text" x="200" y="27" text-anchor="middle">Scikit-learn</text>
  </g>

  <!-- ================= ROW 4 ================= -->
  <!-- Col 1: API TESTING -->
  <g transform="translate(40, 316)">
    <text class="font-sans cat-title" x="0" y="0">API TESTING</text>

    <!-- Postman -->
    <rect class="tag-bg" x="0" y="10" width="78" height="26" rx="5" />
    <text class="font-sans tag-text" x="39" y="27" text-anchor="middle">Postman</text>
  </g>

  <!-- Col 2: IDES &amp; EDITORS -->
  <g transform="translate(470, 316)">
    <text class="font-sans cat-title" x="0" y="0">DEVELOPER IDES</text>

    <!-- IntelliJ IDEA -->
    <rect class="tag-bg" x="0" y="10" width="104" height="26" rx="5" />
    <text class="font-sans tag-text" x="52" y="27" text-anchor="middle">IntelliJ IDEA</text>

    <!-- VS Code -->
    <rect class="tag-bg" x="112" y="10" width="78" height="26" rx="5" />
    <text class="font-sans tag-text" x="151" y="27" text-anchor="middle">VS Code</text>
  </g>

</svg>
