<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%">
  <defs>
    <radialGradient id="techAmbient" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#2D220A" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#101114" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0E1013" stop-opacity="1" />
    </radialGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#362E1C" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#1E1C16" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#292213" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#17150E" />
      <stop offset="100%" stop-color="#1B170E" />
    </linearGradient>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .label {
      fill: #F59E0B;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .heading {
      fill: #FFFFFF;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .cat-title {
      fill: #E5A93C;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .tag-bg {
      fill: #161511;
      stroke: #2E2716;
      stroke-width: 1;
    }
    .tag-text {
      fill: #E2E8F0;
      font-size: 12px;
      font-weight: 500;
    }
  </style>

  <!-- Card Container -->
  <rect x="2" y="2" width="896" height="296" rx="16" fill="url(#techAmbient)" stroke="url(#cardBorder)" stroke-width="1.5" />

  <!-- Card Header -->
  <text class="font-sans label" x="40" y="44">TECHNICAL CAPABILITIES</text>
  <text class="font-sans heading" x="40" y="78">Technologies, frameworks, and infrastructure.</text>

  <!-- ROW 1, COL 1: Core Languages -->
  <g transform="translate(40, 110)">
    <text class="font-sans cat-title" x="0" y="0">LANGUAGES</text>
    
    <!-- Python -->
    <rect class="tag-bg" x="0" y="12" width="68" height="26" rx="5" />
    <text class="font-sans tag-text" x="34" y="29" text-anchor="middle">Python</text>

    <!-- Java -->
    <rect class="tag-bg" x="76" y="12" width="54" height="26" rx="5" />
    <text class="font-sans tag-text" x="103" y="29" text-anchor="middle">Java</text>

    <!-- C++ -->
    <rect class="tag-bg" x="138" y="12" width="50" height="26" rx="5" />
    <text class="font-sans tag-text" x="163" y="29" text-anchor="middle">C++</text>

    <!-- JavaScript -->
    <rect class="tag-bg" x="196" y="12" width="88" height="26" rx="5" />
    <text class="font-sans tag-text" x="240" y="29" text-anchor="middle">JavaScript</text>

    <!-- TypeScript -->
    <rect class="tag-bg" x="292" y="12" width="90" height="26" rx="5" />
    <text class="font-sans tag-text" x="337" y="29" text-anchor="middle">TypeScript</text>

    <!-- SQL -->
    <rect class="tag-bg" x="390" y="12" width="50" height="26" rx="5" />
    <text class="font-sans tag-text" x="415" y="29" text-anchor="middle">SQL</text>
  </g>

  <!-- ROW 1, COL 2: Backend & Databases -->
  <g transform="translate(500, 110)">
    <text class="font-sans cat-title" x="0" y="0">BACKEND &amp; DATABASES</text>

    <!-- Flask -->
    <rect class="tag-bg" x="0" y="12" width="54" height="26" rx="5" />
    <text class="font-sans tag-text" x="27" y="29" text-anchor="middle">Flask</text>

    <!-- Node.js -->
    <rect class="tag-bg" x="62" y="12" width="70" height="26" rx="5" />
    <text class="font-sans tag-text" x="97" y="29" text-anchor="middle">Node.js</text>

    <!-- REST APIs -->
    <rect class="tag-bg" x="140" y="12" width="84" height="26" rx="5" />
    <text class="font-sans tag-text" x="182" y="29" text-anchor="middle">REST APIs</text>

    <!-- MySQL -->
    <rect class="tag-bg" x="232" y="12" width="66" height="26" rx="5" />
    <text class="font-sans tag-text" x="265" y="29" text-anchor="middle">MySQL</text>

    <!-- SQLite -->
    <rect class="tag-bg" x="306" y="12" width="62" height="26" rx="5" />
    <text class="font-sans tag-text" x="337" y="29" text-anchor="middle">SQLite</text>
  </g>

  <!-- ROW 2, COL 1: Machine Learning & Data -->
  <g transform="translate(40, 200)">
    <text class="font-sans cat-title" x="0" y="0">MACHINE LEARNING &amp; DATA</text>

    <!-- Scikit-Learn -->
    <rect class="tag-bg" x="0" y="12" width="96" height="26" rx="5" />
    <text class="font-sans tag-text" x="48" y="29" text-anchor="middle">Scikit-Learn</text>

    <!-- Pandas -->
    <rect class="tag-bg" x="104" y="12" width="68" height="26" rx="5" />
    <text class="font-sans tag-text" x="138" y="29" text-anchor="middle">Pandas</text>

    <!-- NumPy -->
    <rect class="tag-bg" x="180" y="12" width="68" height="26" rx="5" />
    <text class="font-sans tag-text" x="214" y="29" text-anchor="middle">NumPy</text>

    <!-- Data Preprocessing -->
    <rect class="tag-bg" x="256" y="12" width="140" height="26" rx="5" />
    <text class="font-sans tag-text" x="326" y="29" text-anchor="middle">Data Preprocessing</text>
  </g>

  <!-- ROW 2, COL 2: DevOps, Tools & Frontend -->
  <g transform="translate(500, 200)">
    <text class="font-sans cat-title" x="0" y="0">DEVOPS, TOOLS &amp; FRONTEND</text>

    <!-- Docker -->
    <rect class="tag-bg" x="0" y="12" width="66" height="26" rx="5" />
    <text class="font-sans tag-text" x="33" y="29" text-anchor="middle">Docker</text>

    <!-- Git & GitHub -->
    <rect class="tag-bg" x="74" y="12" width="96" height="26" rx="5" />
    <text class="font-sans tag-text" x="122" y="29" text-anchor="middle">Git &amp; GitHub</text>

    <!-- GitHub Actions -->
    <rect class="tag-bg" x="178" y="12" width="112" height="26" rx="5" />
    <text class="font-sans tag-text" x="234" y="29" text-anchor="middle">GitHub Actions</text>

    <!-- React -->
    <rect class="tag-bg" x="298" y="12" width="58" height="26" rx="5" />
    <text class="font-sans tag-text" x="327" y="29" text-anchor="middle">React</text>
  </g>

</svg>
